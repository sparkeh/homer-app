name: App Builder Beta

on:
  push:
    branches: [ beta0 ]
    paths-ignore:
      - '**.md'
      - '**.yml'
  pull_request:
    branches: [ beta0 ]
    paths-ignore:
      - '**.md'

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: beta0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23.7

    - name: Build Frontend
      if: github.event_name != 'pull_request'
      run: echo y | ./scripts/build_frontend.sh

    - name: Build Binary
      run: echo y |./scripts/build_binary.sh

    - name: Build Packages
      if: github.event_name != 'pull_request'
      run: |
          sed -i 's|goreleaser/nfpm|goreleaser/nfpm|g' scripts/build_package.sh
          BUILD_VERSION=$(./homer-app -version | egrep -o '[0-9].[0-9].[0-9]+')
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          VERSION=$BUILD_VERSION make package

    - name: Archive Frontend
      if: github.event_name != 'pull_request'
      run: tar cvfz homer-ui-${{env.BUILD_VERSION}}.tgz dist

    - name: Upload beta pre-release
      if: github.event_name != 'pull_request'
      uses: boxpositron/upload-multiple-releases@1.0.7
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        release_config: |
            homer-app
            homer-app-${{ env.BUILD_VERSION }}-amd64.deb
            homer-app-${{ env.BUILD_VERSION }}-amd64.rpm
            homer-ui-${{ env.BUILD_VERSION }}.tgz
        tag_name: ${{ env.RELEASE_TAG }}
        release_name: homer-app-${{ env.RELEASE_TAG }}
        draft: false
        prerelease: true
        overwrite: true

  docker-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read

    steps:
    - uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2.1.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v4.1.1
      with:
        images: |
          ghcr.io/${{ github.repository }}
        tags: |
          ${{ env.RELEASE_TAG }}

    - name: Build and push
      uses: docker/build-push-action@v3.2.0
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
